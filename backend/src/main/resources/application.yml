spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: jdbc:sqlite:${DRAMA_DB_PATH:./data/drama-studio.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate.ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt-secret: ${JWT_SECRET:development-only-secret-development-only}
  public-base: ${PUBLIC_BASE:/drama-studio}
  oauth:
    client-id: drama-studio
    client-secret: ${AI_CONNECT_CLIENT_SECRET:}
    redirect-uri: ${AI_CONNECT_REDIRECT_URI:http://localhost:8080/auth/callback}
    authorize-url: https://ai-connect.top/api/oauth/authorize
    token-url: https://ai-connect.top/api/oauth/token
    userinfo-url: https://ai-connect.top/api/oauth/userinfo
  oss:
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket: ${OSS_BUCKET:}
    endpoint: ${OSS_ENDPOINT:}
  aiconnect:
    base-url: ${AI_CONNECT_BASE_URL:https://ai-connect.top/v1}
    api-key: ${AI_CONNECT_SK:}
    llm-model: ${AI_CONNECT_LLM_MODEL:hermes-token}
    image-model: ${AI_CONNECT_IMAGE_MODEL:image-free}
    image-to-image-model: ${AI_CONNECT_IMAGE_TO_IMAGE_MODEL:hermes-image}
    video-model: ${AI_CONNECT_VIDEO_MODEL:video-free}
logging.level.org.hibernate.SQL: WARN
