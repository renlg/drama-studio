spring:
  datasource:
    url: jdbc:sqlite:${DRAMA_DB_PATH:./data/drama-studio.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt-secret: ${JWT_SECRET:development-only-secret-development-only}
  oauth:
    client-id: drama-studio
    client-secret: ${AI_CONNECT_CLIENT_SECRET:}
    redirect-uri: ${AI_CONNECT_REDIRECT_URI:http://localhost:8080/auth/callback}
    authorize-url: https://ai-connect.top/api/oauth/authorize
    token-url: https://ai-connect.top/api/oauth/token
    userinfo-url: https://ai-connect.top/api/oauth/userinfo
  oss:
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket: ${OSS_BUCKET:}
    endpoint: ${OSS_ENDPOINT:}
logging.level.org.hibernate.SQL: WARN
