    # drama-studio — AI 短剧生成平台（子目录 /drama-studio/）
    # 前端静态文件
    location /drama-studio/assets/ {
        alias /opt/drama-studio/web/assets/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /drama-studio/ {
        alias /opt/drama-studio/web/;
        index index.html;
        try_files $uri $uri/ /drama-studio/index.html;
    }

    # 后端 API 反代（含 SSE 长连接）
    location /drama-studio/api/ {
        proxy_pass http://127.0.0.1:18080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OAuth 回调 / 登录入口
    location /drama-studio/auth/ {
        proxy_pass http://127.0.0.1:18080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

