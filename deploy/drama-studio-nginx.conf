# drama-studio — AI 短剧生成平台 nginx 子目录配置
# 火山服务器 80 端口，子目录 /drama-studio/
# 前端静态文件: /opt/drama-studio/web
# 后端 API 反代: /drama-studio/api/ → http://127.0.0.1:18080/

# HTTP (80) 反代段 —— 追加到 taiwei.conf 的 80 server 块内
# 前端 SPA + 静态资源
location /drama-studio/ {
    alias /opt/drama-studio/web/;
    index index.html;
    try_files $uri $uri/ /drama-studio/index.html;
}

# 后端 API 反代
location /drama-studio/api/ {
    proxy_pass http://127.0.0.1:18080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_buffering off;
    add_header Access-Control-Allow-Origin *;
}

# SSE 长连接
location /drama-studio/api/stream/ {
    proxy_pass http://127.0.0.1:18080/stream/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}
